<!DOCTYPE html>
<html>
<head>
    <title>Frontend-Backend Connection Test</title>
</head>
<body>
    <h1>Frontend-Backend Connection Test</h1>
    <button onclick="testConnection()">Test Connection</button>
    <button onclick="testAnalysis()">Test Analysis</button>
    <div id="result"></div>

    <script>
        async function testConnection() {
            try {
                const response = await fetch('http://localhost:5001/api/hello');
                const data = await response.json();
                document.getElementById('result').innerHTML = `
                    <h2>Connection Test:</h2>
                    <p>Status: ${response.status}</p>
                    <p>Message: ${data.message}</p>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h2>Connection Error:</h2>
                    <p>${error.message}</p>
                `;
            }
        }

        async function testAnalysis() {
            try {
                const newsId = '4844333674929140008';
                const response = await fetch(`http://localhost:5001/api/analysis/${newsId}?t=${Date.now()}`);
                const analysis = await response.json();
                
                document.getElementById('result').innerHTML = `
                    <h2>Analysis Test:</h2>
                    <p>Status: ${response.status}</p>
                    <p>Analysis Type: ${analysis.analysis_type}</p>
                    <p>News Impact: ${analysis.news_impact ? 'Present' : 'Missing'}</p>
                    <p>Trading Implications: ${analysis.trading_implications ? 'Present' : 'Missing'}</p>
                    <h3>Full Response:</h3>
                    <pre>${JSON.stringify(analysis, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h2>Analysis Error:</h2>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
