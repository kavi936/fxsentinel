<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Warning Banner Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        .test-info {
            background: #333;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .test-button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        .test-button:hover {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <div class="test-info">
        <h2>Mobile Warning Banner Test</h2>
        <p>This test simulates the mobile warning banner functionality.</p>
        <p><strong>Current screen width:</strong> <span id="screen-width"></span>px</p>
        <p><strong>User Agent:</strong> <span id="user-agent"></span></p>
        <p><strong>Mobile Detection:</strong> <span id="mobile-detection"></span></p>
    </div>

    <div>
        <button class="test-button" onclick="clearStorage()">Clear Local Storage</button>
        <button class="test-button" onclick="simulateMobile()">Simulate Mobile Device</button>
        <button class="test-button" onclick="simulateDesktop()">Simulate Desktop</button>
        <button class="test-button" onclick="checkBannerStatus()">Check Banner Status</button>
    </div>

    <script>
        function updateInfo() {
            document.getElementById('screen-width').textContent = window.innerWidth;
            document.getElementById('user-agent').textContent = navigator.userAgent;
            
            const userAgent = navigator.userAgent.toLowerCase();
            const isMobileDevice = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent);
            const isSmallScreen = window.innerWidth <= 768;
            
            document.getElementById('mobile-detection').textContent = 
                isMobileDevice || isSmallScreen ? 'Mobile detected' : 'Desktop detected';
        }

        function clearStorage() {
            localStorage.removeItem('mobileWarningDismissed');
            localStorage.removeItem('mobileWarningReminder');
            alert('Local storage cleared! Banner should show again on mobile.');
        }

        function simulateMobile() {
            // This is just for testing - in real implementation, this would be detected automatically
            alert('To test mobile warning banner:\n1. Resize browser window to < 768px width\n2. Or use browser dev tools to simulate mobile device\n3. Clear local storage if banner was previously dismissed');
        }

        function simulateDesktop() {
            alert('To test desktop (no banner):\n1. Resize browser window to > 768px width\n2. Banner should not appear on desktop');
        }

        function checkBannerStatus() {
            const dismissed = localStorage.getItem('mobileWarningDismissed');
            const reminder = localStorage.getItem('mobileWarningReminder');
            
            alert(`Banner Status:\n- Dismissed: ${dismissed ? 'Yes' : 'No'}\n- Reminder set: ${reminder ? 'Yes' : 'No'}\n- Reminder time: ${reminder ? new Date(parseInt(reminder)).toLocaleString() : 'None'}`);
        }

        // Update info on load and resize
        updateInfo();
        window.addEventListener('resize', updateInfo);
    </script>
</body>
</html>
