<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Functionality Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .success { color: #22c55e; }
        .error { color: #ff4757; }
        .info { color: #ffa502; }
        button {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 10px 5px;
        }
        .news-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .analysis-indicator {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 6px;
            padding: 8px;
            margin-top: 10px;
            font-size: 12px;
        }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>History Functionality Test</h1>
        <p>Testing the enhanced history tab functionality</p>
        
        <div class="test-section">
            <h3>Test 1: Fetch News History</h3>
            <button onclick="testHistoryAPI()">Get History Data</button>
            <div id="history-result"></div>
        </div>
        
        <div class="test-section">
            <h3>Test 2: Display Analyzed News Items</h3>
            <button onclick="displayAnalyzedNews()">Show Analyzed News</button>
            <div id="analyzed-news-result"></div>
        </div>
        
        <div class="test-section">
            <h3>Test 3: Analysis Statistics</h3>
            <button onclick="showAnalysisStats()">Show Stats</button>
            <div id="stats-result"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5001';
        
        async function testHistoryAPI() {
            const resultDiv = document.getElementById('history-result');
            resultDiv.innerHTML = '<p class="info">Fetching history...</p>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/news-history?hours=24`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <p class="success">✅ History API Success!</p>
                        <p class="info">Total Items: ${data.total_items}</p>
                        <p class="info">Analyzed Items: ${data.analyzed_items}</p>
                        <p class="info">Hours Requested: ${data.hours_requested}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Error: ${response.status} ${response.statusText}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
        
        async function displayAnalyzedNews() {
            const resultDiv = document.getElementById('analyzed-news-result');
            resultDiv.innerHTML = '<p class="info">Loading analyzed news...</p>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/news-history?hours=24`);
                const data = await response.json();
                
                if (response.ok && data.history) {
                    const analyzedNews = data.history.filter(item => item.is_analyzed);
                    
                    if (analyzedNews.length > 0) {
                        const newsHTML = analyzedNews.slice(0, 5).map(news => `
                            <div class="news-item">
                                <h4>${news.title}</h4>
                                <p><strong>Source:</strong> ${news.source}</p>
                                <p><strong>Published:</strong> ${new Date(news.published_at).toLocaleString()}</p>
                                <div class="analysis-indicator">
                                    <strong>Analysis Summary:</strong><br>
                                    Type: ${news.analysis_summary?.type || 'Unknown'}<br>
                                    Confidence: ${news.analysis_summary?.confidence || 'N/A'}%<br>
                                    Reaction: ${news.analysis_summary?.reaction || 'N/A'}<br>
                                    ${news.analysis_summary?.cost > 0 ? `Cost: $${news.analysis_summary.cost.toFixed(4)}` : ''}
                                </div>
                            </div>
                        `).join('');
                        
                        resultDiv.innerHTML = `
                            <p class="success">✅ Found ${analyzedNews.length} analyzed news items</p>
                            ${newsHTML}
                        `;
                    } else {
                        resultDiv.innerHTML = '<p class="info">No analyzed news items found</p>';
                    }
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Error: ${response.status}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
        
        async function showAnalysisStats() {
            const resultDiv = document.getElementById('stats-result');
            resultDiv.innerHTML = '<p class="info">Loading stats...</p>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/news-history?hours=24`);
                const data = await response.json();
                
                if (response.ok && data.analysis_stats) {
                    const stats = data.analysis_stats;
                    resultDiv.innerHTML = `
                        <p class="success">✅ Analysis Statistics</p>
                        <p class="info">Total Analyses: ${stats.total_analyses || 0}</p>
                        <p class="info">Total Cost: $${stats.total_cost || 0}</p>
                        <p class="info">Average Confidence: ${stats.average_confidence || 0}%</p>
                        <pre>${JSON.stringify(stats, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">❌ Error: ${response.status}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
